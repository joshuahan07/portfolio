# Build the Vite app, then deploy only `dist/` to GitHub Pages.
# (The previous workflow uploaded the whole repo, so the live site tried to
# run `/src/main.tsx` in the browser and showed a blank white page.)
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Root-absolute assets for the custom domain (joshuahanportfolio.com).
          # If you only use https://joshuahan07.github.io/portfolio/ instead,
          # change this to "/portfolio/" and also set BrowserRouter basename.
          VITE_BASE: /

      - name: Prepare Pages files
        run: |
          cp dist/index.html dist/404.html
          if [ -f CNAME ]; then cp CNAME dist/CNAME; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
